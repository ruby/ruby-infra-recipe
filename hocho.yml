property_providers:
  - add_default:
      properties:
        preferred_driver: mitamae
  # Derive RUBYCI_NICKNAME from the host name and inject AWS credentials
  # for the chkbuild crontab from environment variables at apply time.
  - ruby_script:
      script: |
        return unless host.name.end_with?('.rubyci.org')
        # Keep per-host chkbuild attributes from hosts.yml (e.g. schedule)
        # and add the derived/injected values on top (Hashie::Mash, so
        # indifferent access).
        chkbuild = host.properties.dig(:attributes, :chkbuild) || {}
        chkbuild[:nickname] = host.name.split('.').first
        if ENV['CHKBUILD_AWS_ACCESS_KEY_ID'] && ENV['CHKBUILD_AWS_SECRET_ACCESS_KEY']
          chkbuild[:aws_access_key_id] = ENV['CHKBUILD_AWS_ACCESS_KEY_ID']
          chkbuild[:aws_secret_access_key] = ENV['CHKBUILD_AWS_SECRET_ACCESS_KEY']
        end
        # NOTE: assign, then re-read; Hashie::Mash stores a converted copy,
        # so mutating the right-hand value of `||=` would be lost.
        host.properties[:attributes] ||= {}
        host.properties[:attributes][:fqdn] = host.name
        host.properties[:attributes][:chkbuild] = chkbuild

driver_options:
  mitamae:
    mitamae_path: /usr/local/bin/mitamae
    mitamae_options: ['--log-level', 'info']
    mitamae_prepare_script: |
      mitamae_repo="itamae-kitchen/mitamae"
      case "$(uname -s)" in
        Linux)
          mitamae_os="linux"
          ;;
        Darwin)
          mitamae_os="darwin"
          ;;
        FreeBSD)
          mitamae_os="freebsd"
          ;;
        OpenBSD)
          mitamae_os="openbsd"
          ;;
        SunOS)
          mitamae_os="solaris" # should be "sunos"?
          mitamae_repo="itamae-kitchen/mitamae-build"
          ;;
        *)
          echo "OS '$(uname -s)' is not supported yet"
          exit 1
          ;;
      esac

      case "$(uname -m)" in
        x86_64)
          mitamae_arch="x86_64"
          ;;
        amd64)
          mitamae_arch="x86_64"
          ;;
        aarch64)
          mitamae_arch="aarch64"
          ;;
        arm64)
          # freebsd aarch64 returns `arm64`
          mitamae_arch="aarch64"
          ;;
        ppc64le)
          mitamae_arch="ppc64le"
          ;;
        s390x)
          mitamae_arch="s390x"
          ;;
        *)
          echo "machine '$(uname -m)' is not supported yet"
          exit 1
          ;;
      esac

      function url_exists {
        local url="${1}"
        curl -o /dev/null -sIfL "$url"
      }

      # Get tags in new order. The newest tag is first, the oldest tag is last.
      tags=$(git ls-remote --refs --tags "https://github.com/${mitamae_repo}" \
        | cut -d '/' -f 3 | sort -Vr)
      for tag in ${tags}; do
        url="https://github.com/${mitamae_repo}/releases/download/${tag}/mitamae-${mitamae_arch}-${mitamae_os}"
        if url_exists "${url}"; then
          # The shell redirection creates the file even when curl fails, and a
          # truncated/empty mitamae would get installed and then silently
          # "succeed" on every later run. Keep only a verified download.
          if curl -fL "${url}" > "./mitamae-${mitamae_arch}-${mitamae_os}"; then
            echo "mitamae '${tag}' is downloaded"
            break
          fi
          rm -f "./mitamae-${mitamae_arch}-${mitamae_os}"
        fi
      done

      if [ ! -s "mitamae-${mitamae_arch}-${mitamae_os}" ]; then
        echo "failed to download mitamae" >&2
        exit 1
      fi
      mv "mitamae-${mitamae_arch}-${mitamae_os}" /usr/local/bin/mitamae
      chmod +x /usr/local/bin/mitamae
      /usr/local/bin/mitamae version
