openbsd.rubyci.org:
  properties:
    attributes:
      chkbuild:
        # Reports to rubyci.org as openbsd-current; the hostname itself is
        # still set to openbsd.rubyci.org like every other host.
        nickname: openbsd-current
        schedule: "30 */2 * * *"
    nopasswd_sudo: true
    compress: false
    run_list:
      - recipes/default.rb

ubuntu.rubyci.org:
  properties:
    attributes:
      chkbuild:
        # The primary build runs at :10 and the no-yjit checkout at :30 as
        # the hand-maintained crontab historically did; each checkout has
        # its own lock, so the runs may overlap safely.
        schedule: "10 */3 * * *"
        extra_builds:
          - dir: chkbuild-no-yjit
            nickname: ubuntu-no-yjit
            schedule: "30 */3 * * *"
    nopasswd_sudo: true
    compress: false
    run_list:
      - recipes/default.rb

